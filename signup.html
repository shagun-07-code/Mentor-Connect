<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentors Connect - Sign Up</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #4a0072, #8e2de2);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
    }

    .signup-container {
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      padding: 40px;
      width: 360px;
      text-align: center;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      color: #4a0072;
      margin-bottom: 20px;
      font-weight: 600;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input, select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
    }

    input:focus, select:focus {
      border-color: #8e2de2;
      box-shadow: 0 0 6px rgba(142, 45, 226, 0.3);
    }

    button {
      background: #4a0072;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      transition: 0.3s;
    }

    button:hover {
      background: #3500a0;
    }

    .login-link {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }

    .login-link a {
      color: #8e2de2;
      text-decoration: none;
      font-weight: 500;
    }

    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="signup-container">
    <h2>Create Your Account</h2>

    <form onsubmit="return validateSignup(event)">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="email" id="signupEmail" placeholder="Email" required>
      <input type="password" id="signupPassword" placeholder="Password" required>

      <select id="role" required>
        <option value="">Select Role</option>
        <option value="mentor">Mentor</option>
        <option value="mentee">Mentee</option>
      </select>

      <button type="submit">Sign Up</button>

      <p class="login-link">Already have an account? <a href="login.html">Login</a></p>
    </form>
  </div>

  <script>
    function validateSignup(event) {
      event.preventDefault(); // prevent reload

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value.trim();
      const role = document.getElementById("role").value;

      if (!name || !email || !password || !role) {
        alert("⚠️ Please fill out all fields.");
        return false;
      }

      // Save user info in localStorage
      const user = { name, email, password, role };
      localStorage.setItem("userData", JSON.stringify(user));

      alert(`✅ Welcome ${name}! You have signed up as a ${role}.`);

      // Redirect to login page
      setTimeout(() => {
        window.location.href = "login.html";
      }, 1000);

      return false;
    }
  </script>

</body>
</html>
